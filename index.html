<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تنظيف الواجهات الزجاجية</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f4f6f8;
color: #333;
text-align: center;
padding: 20px;
}
h1 {
font-size: 2rem;
margin-bottom: 20px;
color: #1a237e;
}
.gallery {
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 15px;
max-width: 900px;
margin: 0 auto;
}
.gallery img {
width: 100%;
max-width: 280px;
height: auto;
border-radius: 12px;
box-shadow: 0 4px 10px rgba(0,0,0,0.1);
object-fit: cover;
}
</style>
</head>
<body>

<h1>تنظيف الواجهات الزجاجية</h1>

<div class="gallery">
<img src="اسم_الصورة_1.jpg" alt="صورة 1">
<img src="اسم_الصورة_2.jpg" alt="صورة 2">
<img src="اسم_الصورة_3.jpg" alt="صورة 3">
<img src="اسم_الصورة_4.jpg" alt="صورة 4">
</div>

</body>
</html>
